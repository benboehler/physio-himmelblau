<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Physio Himmelblau</title>
  <defs>
    <clipPath id="tile">
      <rect width="64" height="64" rx="12"/>
    </clipPath>
    <path id="horizon" d="M0 48h64v16H0z"/>
    <clipPath id="below-horizon">
      <use href="#horizon"/>
    </clipPath>
    <!-- Upright geometric lettering, outlined so no font is required. -->
    <path id="letter-p" fill-rule="evenodd" transform="translate(0 1.5)" d="M9 23h3.5v4c2-3 5-4.5 8.5-4.5 7 0 12 5.5 12 12s-5 12-12 12c-3.5 0-6.5-1.5-8.5-4.5v17H9z M12.5 34.5c0 5 3.5 8.5 8.5 8.5s8.5-3.5 8.5-8.5S26 26 21 26s-8.5 3.5-8.5 8.5z"/>
    <path id="letter-h" d="M37 11h3.5v16c2-3 4.5-4.5 8-4.5 6 0 9.5 4 9.5 10.5v15h-3.5V33c0-4.5-2-7-6-7-5 0-8 3.5-8 9v13H37z"/>
  </defs>
  <g clip-path="url(#tile)">
    <path fill="#55C2E7" d="M0 0h64v64H0z"/>
    <use href="#horizon" fill="#fff"/>
    <use href="#letter-p" fill="#fff"/>
    <use href="#letter-h" fill="#fff"/>
    <!-- Only the p's descender crosses the horizon and turns blue. -->
    <use href="#letter-p" fill="#55C2E7" clip-path="url(#below-horizon)"/>
  </g>
</svg>
